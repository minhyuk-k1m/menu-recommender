<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? 🍽️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #f5576c;
            --primary-light: #fff5f5;
            --text: #2d3436;
            --text-light: #636e72;
            --card-bg: rgba(255,255,255,0.97);
            --shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #fda085 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* === Screens === */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.45s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.08); }
        }

        /* === Intro Card === */
        .intro-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 38px 28px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .intro-emoji { font-size: 72px; display: block; margin-bottom: 14px; animation: float 3s ease-in-out infinite; }
        .intro-title {
            font-size: 28px; font-weight: 900; margin-bottom: 8px;
            background: linear-gradient(135deg, #f5576c, #ff6348);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro-desc { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 22px; }

        /* Weather Badge */
        .weather-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f3f5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .weather-badge:hover {
            background: #e9ecef;
        }

        /* Mode Selection */
        .mode-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 26px;
        }
        .mode-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            padding: 14px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: inherit;
        }
        .mode-btn:hover {
            border-color: var(--primary);
            background: #fffafa;
            transform: translateY(-2px);
        }
        .mode-btn.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, #fff5f5, #ffebee);
            box-shadow: 0 4px 14px rgba(245, 87, 108, 0.18);
        }
        .mode-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .mode-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }
        .mode-btn.active .mode-info h4 {
            color: var(--primary);
        }
        .mode-info p {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.35;
        }

        .btn-start {
            background: linear-gradient(135deg, #f5576c, #ff6348);
            color: #fff; border: none; padding: 16px 52px;
            font-size: 18px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(245,87,108,.4);
            font-family: inherit;
            width: 100%;
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(245,87,108,.5); }

        /* === Question === */
        .question-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: var(--shadow);
        }
        .progress-container { margin-bottom: 26px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-light); font-weight: 500; margin-bottom: 8px; }
        .progress-bar { height: 8px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f5576c, #ff6348, #ffa502); border-radius: 10px; transition: width .45s ease; }

        .q-header-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .q-emoji { font-size: 44px; text-align: center; display: block; margin-bottom: 12px; }
        .q-text  { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 22px; line-height: 1.45; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: #f8f9fa; border: 2px solid #e9ecef;
            padding: 14px 18px; border-radius: 14px;
            font-size: 15px; font-weight: 500; cursor: pointer;
            transition: all .22s ease; text-align: left;
            font-family: inherit; display: flex; align-items: center; gap: 12px;
        }
        .option-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateX(4px); }
        .option-btn.selected { border-color: var(--primary); background: linear-gradient(135deg,#fff5f5,#ffe8e8); color: var(--primary); font-weight: 700; }
        .option-btn .oe { font-size: 22px; flex-shrink: 0; }

        .nav-row { display: flex; justify-content: space-between; margin-top: 22px; }
        .btn-prev {
            background: none; border: 2px solid #ddd; padding: 10px 22px;
            border-radius: 50px; font-size: 14px; font-weight: 600;
            cursor: pointer; color: var(--text-light); transition: all .3s; font-family: inherit;
        }
        .btn-prev:hover { border-color: #aaa; color: var(--text); }
        .btn-prev.hidden { visibility: hidden; }

        /* === Loading === */
        .loading-card { text-align: center; padding: 70px 32px; }
        .loading-emoji { font-size: 64px; animation: pulse 1.2s ease-in-out infinite; display: block; }
        .loading-text { margin-top: 22px; font-size: 20px; font-weight: 700; color: #fff; }
        .loading-sub  { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.85); }

        /* === Result === */
        .result-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .result-mode-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #f5576c, #ff6348);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .result-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
        .result-sub   { font-size: 14px; color: var(--text-light); margin-bottom: 22px; }

        .menu-cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .menu-card {
            background: linear-gradient(135deg,#fff,#fafafa);
            border: 2px solid #f0f0f0; border-radius: 16px;
            padding: 18px; text-align: left; animation: slideIn .5s ease both;
        }
        .menu-card:nth-child(1) { border-color: var(--primary); background: linear-gradient(135deg,#fff5f5,#fff); animation-delay:.1s; }
        .menu-card:nth-child(2) { animation-delay:.3s; }
        .menu-card:nth-child(3) { animation-delay:.5s; }

        .mc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .mc-rank {
            font-size: 12px; font-weight: 700; color: #fff;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .menu-card:nth-child(1) .mc-rank { background: linear-gradient(135deg,#f5576c,#ff6348); }
        .menu-card:nth-child(2) .mc-rank { background: linear-gradient(135deg,#a29bfe,#6c5ce7); }
        .menu-card:nth-child(3) .mc-rank { background: linear-gradient(135deg,#81ecec,#00cec9); }

        .mc-emoji { font-size: 34px; }
        .mc-info  { flex: 1; }
        .mc-name  { font-size: 19px; font-weight: 800; }
        .mc-cat   { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; background: #f0f0f0; border-radius: 20px; color: var(--text-light); margin-left: 4px; }
        .mc-desc  { font-size: 13px; color: var(--text-light); margin-top: 5px; line-height: 1.4; }
        .mc-match { font-size: 12px; font-weight: 700; color: var(--primary); margin-top: 6px; }

        .summary-box {
            background: #f8f9fa; border-radius: 14px;
            padding: 18px; margin-bottom: 22px; text-align: left;
        }
        .summary-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
        .summary-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .stag {
            display: inline-block; font-size: 12px; padding: 4px 12px;
            background: #fff; border: 1px solid #e9ecef; border-radius: 20px; color: var(--text-light);
        }
        .stag.mode-tag {
            background: #fff0f2;
            border-color: #fcc2d7;
            color: #d6336c;
            font-weight: 700;
        }
        .stag.weather-tag {
            background: #e7f5ff;
            border-color: #a5d8ff;
            color: #1c7ed6;
            font-weight: 600;
        }

        .reason-box {
            background: linear-gradient(135deg,#fff5f5,#fff0e6);
            border-radius: 14px; padding: 18px; margin-bottom: 22px;
            text-align: left; border: 1px solid #fde2d2;
        }
        .reason-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        .reason-box p  { font-size: 13px; color: var(--text); line-height: 1.6; }

        .btn-restart {
            background: linear-gradient(135deg,#a29bfe,#6c5ce7);
            color: #fff; border: none; padding: 14px 40px;
            font-size: 16px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(108,92,231,.3);
            font-family: inherit;
        }
        .btn-restart:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(108,92,231,.4); }

        /* === Share === */
        .share-section { margin-top: 16px; margin-bottom: 0; }
        .btn-share {
            background: linear-gradient(135deg,#00b894,#00cec9);
            color: #fff; border: none; padding: 14px 40px;
            font-size: 16px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(0,184,148,.3);
            font-family: inherit; margin-bottom: 12px;
        }
        .btn-share:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0,184,148,.4); }

        .share-panel {
            display: none; background: #f8f9fa; border-radius: 16px;
            padding: 18px; animation: fadeIn .3s ease;
        }
        .share-panel.open { display: block; }
        .share-panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; text-align: center; }

        .share-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .share-btn {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            background: #fff; border: 1.5px solid #e9ecef; border-radius: 14px;
            padding: 16px 6px; cursor: pointer; transition: all .2s;
            font-family: inherit; font-size: 11px; font-weight: 600; color: var(--text-light);
        }
        .share-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .share-btn .share-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .share-btn .share-icon svg { width: 28px; height: 28px; }

        .share-btn.x-twitter  { border-color: #e0e0e0; }
        .share-btn.x-twitter:hover  { background: #f7f7f7; border-color: #000; }
        .share-btn.facebook { border-color: #d4daf7; }
        .share-btn.facebook:hover { background: #eef0fb; border-color: #1877F2; }
        .share-btn.kakao    { border-color: #f5edc8; }
        .share-btn.kakao:hover    { background: #fdf8e8; border-color: #FEE500; }
        .share-btn.instagram { border-color: #f0d4e8; }
        .share-btn.instagram:hover { background: #fdf0f8; border-color: #E1306C; }
        .share-btn.copy     { border-color: #e0e0e0; }
        .share-btn.copy:hover     { background: #f5f5f5; border-color: #888; }
        .share-btn.native   { border-color: #e0d4f7; }
        .share-btn.native:hover   { background: #f3eefb; border-color: #6c5ce7; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #2d3436; color: #fff; padding: 12px 28px; border-radius: 50px;
            font-size: 14px; font-weight: 600; box-shadow: 0 8px 25px rgba(0,0,0,.25);
            transition: transform .35s ease, opacity .35s ease; opacity: 0;
            z-index: 999; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width:480px) {
            body { padding: 12px; }
            .intro-card,.question-card,.result-card { padding: 24px 18px; }
            .intro-title { font-size: 24px; }
            .intro-emoji { font-size: 58px; }
            .q-text { font-size: 17px; }
            .option-btn { padding: 12px 14px; font-size: 14px; }
            .share-grid { grid-template-columns: repeat(2, 1fr); }
            .mode-btn { padding: 12px 14px; }
            .mode-icon { font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== INTRO ===== -->
    <div id="screen-intro" class="screen active">
        <div class="intro-card">
            <span class="intro-emoji">🤔</span>
            <h1 class="intro-title">오늘 뭐 먹지?</h1>
            <p class="intro-desc">
                매일 반복되는 식사 메뉴 고민, 이제 끝!<br>
                취향과 상황에 딱 맞는 메뉴를 추천해 드려요 🍽️
            </p>

            <!-- Real-time Weather Badge -->
            <div class="weather-badge" id="weather-badge" onclick="requestLocation()" title="클릭하여 현재 위치 날씨 새로고침">
                <span id="weather-icon">🌤️</span>
                <span id="weather-text">날씨 정보 불러오는 중...</span>
            </div>

            <!-- Mode Selection -->
            <div class="mode-title">🎯 추천 모드를 선택해주세요:</div>
            <div class="mode-grid">
                <button type="button" class="mode-btn active" data-mode="general" onclick="selectMode('general')">
                    <span class="mode-icon">🍱</span>
                    <div class="mode-info">
                        <h4>일반 모드</h4>
                        <p>오늘 땡기는 맛있는 일상 식사 메뉴 추천</p>
                    </div>
                </button>
                <button type="button" class="mode-btn" data-mode="diet" onclick="selectMode('diet')">
                    <span class="mode-icon">🥗</span>
                    <div class="mode-info">
                        <h4>다이어트 모드</h4>
                        <p>저칼로리 & 고단백! 가볍고 건강한 식단</p>
                    </div>
                </button>
                <button type="button" class="mode-btn" data-mode="health" onclick="selectMode('health')">
                    <span class="mode-icon">🥣</span>
                    <div class="mode-info">
                        <h4>건강 / 회복식 모드</h4>
                        <p>속이 편하고 소화 잘 되는 부드러운 힐링 메뉴</p>
                    </div>
                </button>
            </div>

            <button class="btn-start" onclick="startQuiz()">질문 시작하기 →</button>
        </div>
        <p style="margin-top:16px; font-size:11px; font-weight:500; color:rgba(255,255,255,0.6); letter-spacing:0.12em; text-align:center;">MADE BY MINHYUK KIM</p>
    </div>

    <!-- ===== QUESTION ===== -->
    <div id="screen-question" class="screen">
        <div class="question-card">
            <div class="progress-container">
                <div class="progress-info">
                    <span id="prog-text"></span>
                    <span id="prog-pct"></span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <div style="text-align: center;">
                <span class="q-header-tag" id="q-mode-tag">🍱 일반 모드</span>
            </div>
            <span class="q-emoji" id="q-emoji"></span>
            <h2 class="q-text" id="q-text"></h2>
            <div class="options" id="opts"></div>
            <div class="nav-row">
                <button class="btn-prev" id="btn-prev" onclick="prevQ()">← 이전</button>
            </div>
        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div id="screen-loading" class="screen">
        <div class="loading-card">
            <span class="loading-emoji">🍳</span>
            <p class="loading-text">최적의 메뉴를 찾는 중...</p>
            <p class="loading-sub" id="loading-sub-text">실시간 날씨와 모드별 맞춤 분석을 진행하고 있어요!</p>
        </div>
    </div>

    <!-- ===== RESULT ===== -->
    <div id="screen-result" class="screen">
        <div class="result-card">
            <span class="result-mode-badge" id="res-mode-badge">🍱 일반 모드 추천</span>
            <h2 class="result-title">🎉 오늘의 추천 메뉴</h2>
            <p class="result-sub">당신의 성향과 현재 날씨를 종합하여 골랐어요!</p>
            <div class="menu-cards" id="menu-cards"></div>
            <div class="reason-box" id="reason-box"></div>
            <div class="summary-box" id="summary-box"></div>
            <button class="btn-restart" onclick="restart()">🔄 다시 하기</button>

            <div class="share-section">
                <button class="btn-share" onclick="toggleSharePanel()">📤 결과 공유하기</button>
                <div class="share-panel" id="share-panel">
                    <h3>친구에게 공유해 보세요!</h3>
                    <div class="share-grid">
                        <!-- X (Twitter) -->
                        <button class="share-btn x-twitter" onclick="shareX()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>
                            <span>X</span>
                        </button>
                        <!-- Facebook -->
                        <button class="share-btn facebook" onclick="shareFacebook()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></span>
                            <span>Facebook</span>
                        </button>
                        <!-- 카카오톡 -->
                        <button class="share-btn kakao" onclick="shareKakao()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#3C1E1E"><path d="M12 3c-5.523 0-10 3.582-10 8 0 2.838 1.876 5.327 4.717 6.734-.208.774-.755 2.807-.864 3.244-.136.547.2.54.42.394.172-.114 2.741-1.862 3.858-2.618A11.57 11.57 0 0012 19c5.523 0 10-3.582 10-8s-4.477-8-10-8z"/></svg></span>
                            <span>카카오톡</span>
                        </button>

<script>
/* ================================================================
   GLOBAL STATE & MODE
   ================================================================ */
let selectedMode = 'general'; // 'general' | 'diet' | 'health'
let currentQ = 0;
const answers = {};
let detectedWeather = ['cool']; // 'hot' | 'cool' | 'cold' | 'rainy'
let weatherInfo = { temp: 22, text: '쾌적한 날씨', icon: '🌤️' };

/* ================================================================
   WEATHER & GEOLOCATION SERVICE (Open-Meteo API)
   ================================================================ */
function initWeather() {
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                fetchWeather(pos.coords.latitude, pos.coords.longitude, true);
            },
            (err) => {
                // 권한 거부 또는 실패 시 서울 기본 좌표 기준 날씨 가져오기
                fetchWeather(37.5665, 126.9780, false);
            },
            { timeout: 8000 }
        );
    } else {
        fetchWeather(37.5665, 126.9780, false);
    }
}

async function fetchWeather(lat, lon, hasLocation) {
    try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        if (!res.ok) throw new Error("Weather fetch failed");
        const data = await res.json();
        const cw = data.current_weather;
        const temp = Math.round(cw.temperature);
        const code = cw.weathercode;

        let icon = '🌤️';
        let desc = '맑음/쾌적';
        const tags = [];

        // 온도 태그
        if (temp >= 28) {
            tags.push('hot');
        } else if (temp <= 10) {
            tags.push('cold');
        } else {
            tags.push('cool');
        }

        // WMO 날씨 코드 매핑
        if (code >= 51 && code <= 67 || (code >= 80 && code <= 82) || (code >= 95 && code <= 99)) {
            tags.push('rainy');
            icon = '🌧️';
            desc = '비/흐림';
        } else if (code >= 71 && code <= 77 || code === 85 || code === 86) {
            tags.push('cold');
            icon = '❄️';
            desc = '눈';
        } else if (code === 0 || code === 1) {
            icon = temp >= 28 ? '🔥' : '☀️';
            desc = '맑음';
        } else if (code === 2 || code === 3) {
            icon = '⛅';
            desc = '구름 조금';
        } else {
            icon = '🌥️';
            desc = '흐림';
        }

        detectedWeather = tags;
        weatherInfo = {
            temp: temp,
            text: `${temp}°C ${desc}`,
            icon: icon,
            isExact: hasLocation
        };

        updateWeatherBadge();
    } catch (e) {
        // Fallback default
        detectedWeather = ['cool'];
        weatherInfo = { temp: 22, text: '22°C 쾌적함', icon: '🌤️', isExact: false };
        updateWeatherBadge();
    }
}

function updateWeatherBadge() {
    const badge = document.getElementById('weather-badge');
    const iconEl = document.getElementById('weather-icon');
    const textEl = document.getElementById('weather-text');
    if (badge && iconEl && textEl) {
        iconEl.textContent = weatherInfo.icon;
        textEl.textContent = `📍 현재 날씨: ${weatherInfo.text}` + (weatherInfo.isExact ? ' (위치 감지)' : '');
    }
}

function requestLocation() {
    if ("geolocation" in navigator) {
        showToast('📍 현재 위치의 실시간 날씨를 조회합니다...');
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                fetchWeather(pos.coords.latitude, pos.coords.longitude, true);
                showToast('✅ 현재 위치의 날씨가 성공적으로 반영되었습니다!');
            },
            (err) => {
                showToast('ℹ️ 브라우저 위치 권한을 허용하시면 더 정확한 날씨가 반영돼요.');
            }
        );
    }
}

    selectedMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => {

/* ================================================================
   SCREEN SWITCHING
   ================================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

/* ================================================================
   QUIZ FLOW
   ================================================================ */
function startQuiz() {
  currentQ = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  showScreen('question');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;

  // progress
  const pct = Math.round(((currentQ + 1) / total) * 100);
  document.getElementById('prog-text').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width  = pct + '%';

  // Mode tag update
  const modeLabels = { general: '🍱 일반 모드', diet: '🥗 다이어트 모드', health: '🥣 건강/회복식 모드' };
  document.getElementById('q-mode-tag').textContent = modeLabels[selectedMode] || '🍱 일반 모드';

  // question info
  document.getElementById('q-emoji').textContent = q.emoji;
  document.getElementById('q-text').textContent  = q.text;

  // options
  const wrap = document.getElementById('opts');
  wrap.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[q.id] === opt.value ? ' selected' : '');
    btn.innerHTML = `<span class="oe">${opt.emoji}</span><span>${opt.label}</span>`;
    btn.onclick = () => selectOption(q.id, opt.value);
    wrap.appendChild(btn);
  });

  // prev button
  document.getElementById('btn-prev').classList.toggle('hidden', currentQ === 0);

  // animation reflow
  const card = document.querySelector('.question-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideIn .35s ease';
}

function selectOption(qId, value) {
  answers[qId] = value;

  // highlight clicked
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');

  setTimeout(() => {
    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showLoading();
    }
  }, 260);
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

/* ================================================================
   LOADING → RESULT
   ================================================================ */
function showLoading() {
  showScreen('loading');
  const modeTexts = {
      general: '현재 날씨와 취향에 딱 맞는 맛있는 메뉴를 선별하고 있어요!',
      diet: '칼로리 걱정 없는 건강하고 맛있는 다이어트 식단을 계산하고 있어요!',
      health: '속이 편안하고 기운을 북돋아줄 정갈한 회복식을 고르고 있어요!'
  };
  document.getElementById('loading-sub-text').textContent = modeTexts[selectedMode] || '당신의 취향을 분석하고 있어요!';

  setTimeout(() => {
    const results = recommend();
    renderResult(results);
    showScreen('result');
  }, 1600);
}

/* ================================================================
   RECOMMENDATION ENGINE
   ================================================================ */
function recommend() {
  // 1. Filter by selected mode
  let pool = MENUS.filter(m => m.modes && m.modes.includes(selectedMode));
  if (pool.length === 0) pool = MENUS;

  // 2. Weights
  const WEIGHTS = {
    gender: 1,
    meal: 1,
    mood: 1,
    hunger: 1,
    taste: 2,
    type: 2,
    people: 1,
    budget: 1
  };

  const scored = pool.map(menu => {
    let score = 0;
    let maxScore = 0;

    // 질문 기반 점수 계산
    for (const key of Object.keys(WEIGHTS)) {
      const w = WEIGHTS[key];
      maxScore += w;

      if (key === 'taste' && answers.taste === 'any') {
        // '잘 모르겠어요' 선택 시 맛에 대한 편향 없이 기본 점수 부여
        score += w * 0.75;
      } else if (answers[key] && menu.tags[key] && menu.tags[key].includes(answers[key])) {
        score += w;
      }
    }

    // 3. 자동 감지된 실시간 날씨 가중치 (추가 보너스 2점)
    maxScore += 2;
    if (detectedWeather && menu.tags.weather) {
      const weatherMatch = detectedWeather.some(w => menu.tags.weather.includes(w));
      if (weatherMatch) {
        score += 2;
      }
    }

    const pct = Math.min(100, Math.max(50, Math.round((score / maxScore) * 100)));
    return { menu, score, maxScore, pct };
  });

  // 점수 내림차순 정렬 + 동점 시 무작위 셔플
  scored.sort((a, b) => b.score - a.score || Math.random() - 0.5);

  return scored.slice(0, 3);
}

/* ================================================================
   RENDER RESULT
   ================================================================ */
let lastTop3 = [];

function renderResult(top3) {
  lastTop3 = top3;

  // Mode badge
  const modeLabels = { general: '🍱 일반 모드 추천', diet: '🥗 다이어트 모드 추천', health: '🥣 건강/회복식 추천' };
  document.getElementById('res-mode-badge').textContent = modeLabels[selectedMode] || '🍱 일반 모드 추천';

  // Menu cards
  const wrap = document.getElementById('menu-cards');
  wrap.innerHTML = '';
  top3.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.style.animationDelay = (i * 0.15) + 's';
    card.innerHTML = `
      <div class="mc-header">
        <span class="mc-rank">${i + 1}</span>
        <span class="mc-emoji">${item.menu.emoji}</span>
        <div class="mc-info">
          <span class="mc-name">${item.menu.name}</span>
          <span class="mc-cat">${item.menu.cat}</span>
        </div>
      </div>
      <p class="mc-desc">${item.menu.desc}</p>
      <p class="mc-match">매칭률 ${item.pct}%</p>`;
    wrap.appendChild(card);
  });

  // Reason
  const reasonBox = document.getElementById('reason-box');
  reasonBox.innerHTML = `<h3>💡 이런 이유로 추천했어요</h3><p>${buildReason()}</p>`;

  // Answer summary
  const sumBox = document.getElementById('summary-box');
  const tags = [];
  
  // 모드 및 실시간 날씨 태그
  tags.push(`<span class="stag mode-tag">${modeLabels[selectedMode]}</span>`);
  tags.push(`<span class="stag weather-tag">${weatherInfo.icon} ${weatherInfo.text}</span>`);

  QUESTIONS.forEach(q => {
    const chosen = q.options.find(o => o.value === answers[q.id]);
    if (chosen) {
      tags.push(`<span class="stag">${chosen.emoji} ${chosen.label}</span>`);
    }
  });

  sumBox.innerHTML = `<h3>📋 나의 답변 및 조건 요약</h3><div class="summary-tags">${tags.join('')}</div>`;

  // Native share button
  if (navigator.share) {
    document.getElementById('btn-native-share').style.display = '';
  }
  document.getElementById('share-panel').classList.remove('open');
}

/* ================================================================
   BUILD REASON TEXT
   ================================================================ */
function buildReason() {
  const parts = [];

  // 모드별 수식어
  if (selectedMode === 'diet') {
    parts.push('칼로리 부담 없는 가벼운 식단을 위해');
  } else if (selectedMode === 'health') {
    parts.push('속을 편안하게 달래줄 부드러운 음식을 위해');
  }

  // 실시간 날씨 반영
  if (detectedWeather.includes('rainy')) {
    parts.push('비 오고 흐린 날씨에 생각나는');
  } else if (detectedWeather.includes('cold')) {
    parts.push(`쌀쌀한 기온(${weatherInfo.temp}°C)에 몸을 녹여줄`);
  } else if (detectedWeather.includes('hot')) {
    parts.push(`더운 날씨(${weatherInfo.temp}°C)에 입맛을 살려줄`);
  } else {
    parts.push(`쾌적한 날씨(${weatherInfo.temp}°C)에 기분 좋게 즐길 수 있는`);
  }

  // 기분
  const mMap = { stressed:'스트레스 해소에 어울리는', happy:'기분 좋은 날 더욱 활력을 더해줄', normal:'편안하게 한 끼를 채워줄', sad:'마음을 따스하게 위로해줄' };
  if (answers.mood && mMap[answers.mood]) parts.push(mMap[answers.mood]);

  // 맛
  const tMap = { spicy:'매콤하고 칼칼한', savory:'고소하고 담백한', sweet:'달콤하고 부드러운', sour:'새콤상큼한', salty:'감칠맛 도는' };
  if (answers.taste && tMap[answers.taste]) parts.push(tMap[answers.taste]);

  // 형태
  const tyMap = { soup:'국물 요리', rice:'밥 요리', noodle:'면 요리', meat:'단백질 요리', light:'가벼운 음식' };
  if (answers.type && tyMap[answers.type]) parts.push(tyMap[answers.type] + '를');

  let reason = parts.join(' ') + ' 추천해 드립니다. ';

  const hMap = {
      very: '출출하신 만큼 든든하고 만족스러운 식사가 될 거예요!',
      moderate: '적당하고 기분 좋은 포만감을 느끼실 수 있어요.',
      light: '부담 없이 깔끔하게 드시기 딱 좋아요.',
      bored: '기분 전환으로 가볍게 즐기기 제격이에요.'
  };
  if (answers.hunger && hMap[answers.hunger]) reason += hMap[answers.hunger];

  return reason;
}

/* ================================================================
   RESTART
   ================================================================ */
function restart() {
  currentQ = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  const panel = document.getElementById('share-panel');
  if (panel) panel.classList.remove('open');
  showScreen('intro');
}

/* ================================================================
   SHARE FUNCTIONS
   ================================================================ */
function getShareText() {
  if (!lastTop3 || lastTop3.length === 0) {
    return '🍽️ [오늘 뭐 먹지?] 나를 위한 맞춤 메뉴 추천 사이트!';
  }
  const modeLabels = { general: '일반식', diet: '다이어트식', health: '건강/회복식' };
  const menus = lastTop3.map((item, i) =>
    `${i + 1}위: ${item.menu.emoji} ${item.menu.name} (${item.menu.cat}) - 매칭률 ${item.pct}%`
  ).join('\n');

  return `🍽️ [오늘 뭐 먹지?] ${modeLabels[selectedMode]} 맞춤 추천 결과!\n\n${menus}\n\n👉 나도 메뉴 추천받기:`;
}

function getShareUrl() {
  if (window.location.protocol.startsWith('http')) {
    return window.location.href;
  }
  return 'https://minhyuk.site';
}

function toggleSharePanel() {
  const panel = document.getElementById('share-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function shareX() {
  const text = getShareText();
  const url = getShareUrl();
  const fullText = `${text}\n${url}`;
  const xUrl = `https://x.com/intent/post?text=${encodeURIComponent(fullText)}`;
  window.open(xUrl, '_blank', 'width=600,height=500,noopener,noreferrer');
}

function shareFacebook() {
  const url = getShareUrl();
  const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
  window.open(fbUrl, '_blank', 'width=600,height=500,noopener,noreferrer');
}

function shareKakao() {
  const text = getShareText() + '\n' + getShareUrl();
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (navigator.share && isMobile) {
    navigator.share({
      title: '오늘 뭐 먹지? 🍽️',
      text: text,
      url: getShareUrl()
    }).catch(() => {});
    return;
  }

  copyToClipboard(text, '💬 카카오톡에 보낼 내용이 복사되었어요! 대화방에 붙여넣기 해주세요');

  if (isMobile) {
    setTimeout(() => {
      window.location.href = 'kakaotalk://';
    }, 800);
  }
}

function shareInstagram() {
  const text = getShareText() + '\n' + getShareUrl();
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (navigator.share && isMobile) {
    navigator.share({
      title: '오늘 뭐 먹지? 🍽️',
      text: text,
      url: getShareUrl()
    }).catch(() => {});
    return;
  }

  copyToClipboard(text, '📸 결과가 복사되었어요! Instagram DM에 붙여넣기 해주세요');

  if (isMobile) {
    setTimeout(() => {
      window.location.href = 'instagram://direct-inbox';
    }, 800);
  }
}

function copyResult() {
  const text = getShareText() + '\n' + getShareUrl();
  copyToClipboard(text, '📋 추천 결과가 클립보드에 복사되었어요!');
}

function copyLink() {
  copyToClipboard(getShareUrl(), '🔗 링크가 클립보드에 복사되었어요!');
}

function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(successMsg);
    }).catch(() => {
      fallbackCopy(text, successMsg);
    });
  } else {
    fallbackCopy(text, successMsg);
  }
}

function fallbackCopy(text, successMsg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.width = '2em';
  ta.style.height = '2em';
  ta.style.padding = '0';
  ta.style.border = 'none';
  ta.style.outline = 'none';
  ta.style.boxShadow = 'none';
  ta.style.background = 'transparent';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    const successful = document.execCommand('copy');
    if (successful) {
      showToast(successMsg);
    } else {
      showToast('❌ 복사에 실패했어요. 링크를 직접 복사해 주세요.');
    }
  } catch (err) {
    showToast('❌ 복사에 실패했어요.');
  }
  document.body.removeChild(ta);
}

function nativeShare() {
  const text = getShareText();
  const url = getShareUrl();
  if (navigator.share) {
    navigator.share({
      title: '오늘 뭐 먹지? 🍽️ 메뉴 추천 결과',
      text: text,
      url: url
    }).catch(() => {});
  } else {
    copyToClipboard(text + '\n' + url, '📋 전체 내용과 링크가 복사되었어요!');
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* Initialize Weather on Load */
window.addEventListener('DOMContentLoaded', () => {
    initWeather();
});
</script>
