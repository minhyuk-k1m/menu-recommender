<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? 🍽️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #f5576c;
            --primary-light: #fff5f5;
            --text: #2d3436;
            --text-light: #636e72;
            --card-bg: rgba(255,255,255,0.97);
            --shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #fda085 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* === Screens === */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.45s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50%     { transform: scale(1.08); }
        }

        /* === Intro === */
        .intro-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .intro-emoji { font-size: 80px; display: block; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        .intro-title {
            font-size: 28px; font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(135deg, #f5576c, #ff6348);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro-desc { font-size: 15px; color: var(--text-light); line-height: 1.7; margin-bottom: 32px; }

        .btn-start {
            background: linear-gradient(135deg, #f5576c, #ff6348);
            color: #fff; border: none; padding: 16px 52px;
            font-size: 18px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(245,87,108,.4);
            font-family: inherit;
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(245,87,108,.5); }

        /* === Question === */
        .question-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: var(--shadow);
        }
        .progress-container { margin-bottom: 26px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-light); font-weight: 500; margin-bottom: 8px; }
        .progress-bar { height: 8px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f5576c, #ff6348, #ffa502); border-radius: 10px; transition: width .45s ease; }

        .q-emoji { font-size: 44px; text-align: center; display: block; margin-bottom: 14px; }
        .q-text  { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 22px; line-height: 1.45; }

        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: #f8f9fa; border: 2px solid #e9ecef;
            padding: 14px 18px; border-radius: 14px;
            font-size: 15px; font-weight: 500; cursor: pointer;
            transition: all .22s ease; text-align: left;
            font-family: inherit; display: flex; align-items: center; gap: 12px;
        }
        .option-btn:hover { border-color: var(--primary); background: var(--primary-light); transform: translateX(4px); }
        .option-btn.selected { border-color: var(--primary); background: linear-gradient(135deg,#fff5f5,#ffe8e8); color: var(--primary); font-weight: 700; }
        .option-btn .oe { font-size: 22px; flex-shrink: 0; }

        .nav-row { display: flex; justify-content: space-between; margin-top: 22px; }
        .btn-prev {
            background: none; border: 2px solid #ddd; padding: 10px 22px;
            border-radius: 50px; font-size: 14px; font-weight: 600;
            cursor: pointer; color: var(--text-light); transition: all .3s; font-family: inherit;
        }
        .btn-prev:hover { border-color: #aaa; color: var(--text); }
        .btn-prev.hidden { visibility: hidden; }

        /* === Loading === */
        .loading-card { text-align: center; padding: 70px 32px; }
        .loading-emoji { font-size: 64px; animation: pulse 1.2s ease-in-out infinite; display: block; }
        .loading-text { margin-top: 22px; font-size: 20px; font-weight: 700; color: #fff; }
        .loading-sub  { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.85); }

        /* === Result === */
        .result-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .result-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
        .result-sub   { font-size: 14px; color: var(--text-light); margin-bottom: 26px; }

        .menu-cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .menu-card {
            background: linear-gradient(135deg,#fff,#fafafa);
            border: 2px solid #f0f0f0; border-radius: 16px;
            padding: 18px; text-align: left; animation: slideIn .5s ease both;
        }
        .menu-card:nth-child(1) { border-color: var(--primary); background: linear-gradient(135deg,#fff5f5,#fff); animation-delay:.1s; }
        .menu-card:nth-child(2) { animation-delay:.3s; }
        .menu-card:nth-child(3) { animation-delay:.5s; }

        .mc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .mc-rank {
            font-size: 12px; font-weight: 700; color: #fff;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .menu-card:nth-child(1) .mc-rank { background: linear-gradient(135deg,#f5576c,#ff6348); }
        .menu-card:nth-child(2) .mc-rank { background: linear-gradient(135deg,#a29bfe,#6c5ce7); }
        .menu-card:nth-child(3) .mc-rank { background: linear-gradient(135deg,#81ecec,#00cec9); }

        .mc-emoji { font-size: 34px; }
        .mc-info  { flex: 1; }
        .mc-name  { font-size: 19px; font-weight: 800; }
        .mc-cat   { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; background: #f0f0f0; border-radius: 20px; color: var(--text-light); margin-left: 4px; }
        .mc-desc  { font-size: 13px; color: var(--text-light); margin-top: 5px; line-height: 1.4; }
        .mc-match { font-size: 12px; font-weight: 700; color: var(--primary); margin-top: 6px; }

        .summary-box {
            background: #f8f9fa; border-radius: 14px;
            padding: 18px; margin-bottom: 22px; text-align: left;
        }
        .summary-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
        .summary-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .stag {
            display: inline-block; font-size: 12px; padding: 4px 12px;
            background: #fff; border: 1px solid #e9ecef; border-radius: 20px; color: var(--text-light);
        }

        .reason-box {
            background: linear-gradient(135deg,#fff5f5,#fff0e6);
            border-radius: 14px; padding: 18px; margin-bottom: 22px;
            text-align: left; border: 1px solid #fde2d2;
        }
        .reason-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        .reason-box p  { font-size: 13px; color: var(--text); line-height: 1.6; }

        .btn-restart {
            background: linear-gradient(135deg,#a29bfe,#6c5ce7);
            color: #fff; border: none; padding: 14px 40px;
            font-size: 16px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(108,92,231,.3);
            font-family: inherit;
        }
        .btn-restart:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(108,92,231,.4); }

        /* === Share === */
        .share-section { margin-top: 16px; margin-bottom: 0; }
        .btn-share {
            background: linear-gradient(135deg,#00b894,#00cec9);
            color: #fff; border: none; padding: 14px 40px;
            font-size: 16px; font-weight: 700; border-radius: 50px;
            cursor: pointer; transition: all .3s;
            box-shadow: 0 8px 25px rgba(0,184,148,.3);
            font-family: inherit; margin-bottom: 12px;
        }
        .btn-share:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0,184,148,.4); }

        .share-panel {
            display: none; background: #f8f9fa; border-radius: 16px;
            padding: 18px; animation: fadeIn .3s ease;
        }
        .share-panel.open { display: block; }
        .share-panel h3 { font-size: 14px; font-weight: 700; margin-bottom: 14px; text-align: center; }

        .share-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .share-btn {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            background: #fff; border: 1.5px solid #e9ecef; border-radius: 14px;
            padding: 16px 6px; cursor: pointer; transition: all .2s;
            font-family: inherit; font-size: 11px; font-weight: 600; color: var(--text-light);
        }
        .share-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .share-btn .share-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .share-btn .share-icon svg { width: 28px; height: 28px; }

        .share-btn.x-twitter  { border-color: #e0e0e0; }
        .share-btn.x-twitter:hover  { background: #f7f7f7; border-color: #000; }
        .share-btn.facebook { border-color: #d4daf7; }
        .share-btn.facebook:hover { background: #eef0fb; border-color: #1877F2; }
        .share-btn.kakao    { border-color: #f5edc8; }
        .share-btn.kakao:hover    { background: #fdf8e8; border-color: #FEE500; }
        .share-btn.instagram { border-color: #f0d4e8; }
        .share-btn.instagram:hover { background: #fdf0f8; border-color: #E1306C; }
        .share-btn.copy     { border-color: #e0e0e0; }
        .share-btn.copy:hover     { background: #f5f5f5; border-color: #888; }
        .share-btn.native   { border-color: #e0d4f7; }
        .share-btn.native:hover   { background: #f3eefb; border-color: #6c5ce7; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #2d3436; color: #fff; padding: 12px 28px; border-radius: 50px;
            font-size: 14px; font-weight: 600; box-shadow: 0 8px 25px rgba(0,0,0,.25);
            transition: transform .35s ease, opacity .35s ease; opacity: 0;
            z-index: 999; white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @media (max-width:480px) {
            body { padding: 12px; }
            .intro-card,.question-card,.result-card { padding: 24px 18px; }
            .intro-title { font-size: 24px; }
            .intro-emoji { font-size: 64px; }
            .q-text { font-size: 17px; }
            .option-btn { padding: 12px 14px; font-size: 14px; }
            .share-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== INTRO ===== -->
    <div id="screen-intro" class="screen active">
        <div class="intro-card">
            <span class="intro-emoji">🤔</span>
            <h1 class="intro-title">오늘 뭐 먹지?</h1>
            <p class="intro-desc">
                매일 반복되는 메뉴 고민, 이제 그만!<br>
                간단한 질문 <strong>9개</strong>에 답하면<br>
                딱 맞는 메뉴를 추천해 드릴게요 🍽️
            </p>
            <button class="btn-start" onclick="startQuiz()">시작하기 →</button>
        </div>
        <p style="margin-top:16px; font-size:11px; font-weight:500; color:rgba(255,255,255,0.5); letter-spacing:0.12em; text-align:center;">MADE BY MINHYUK KIM</p>
    </div>

    <!-- ===== QUESTION ===== -->
    <div id="screen-question" class="screen">
        <div class="question-card">
            <div class="progress-container">
                <div class="progress-info">
                    <span id="prog-text"></span>
                    <span id="prog-pct"></span>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <span class="q-emoji" id="q-emoji"></span>
            <h2 class="q-text" id="q-text"></h2>
            <div class="options" id="opts"></div>
            <div class="nav-row">
                <button class="btn-prev" id="btn-prev" onclick="prevQ()">← 이전</button>
            </div>
        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div id="screen-loading" class="screen">
        <div class="loading-card">
            <span class="loading-emoji">🍳</span>
            <p class="loading-text">메뉴를 고르는 중...</p>
            <p class="loading-sub">당신의 취향을 분석하고 있어요!</p>
        </div>
    </div>

    <!-- ===== RESULT ===== -->
    <div id="screen-result" class="screen">
        <div class="result-card">
            <h2 class="result-title">🎉 오늘의 추천 메뉴</h2>
            <p class="result-sub">당신의 답변을 바탕으로 골라봤어요!</p>
            <div class="menu-cards" id="menu-cards"></div>
            <div class="reason-box" id="reason-box"></div>
            <div class="summary-box" id="summary-box"></div>
            <button class="btn-restart" onclick="restart()">🔄 다시 하기</button>

            <div class="share-section">
                <button class="btn-share" onclick="toggleSharePanel()">📤 결과 공유하기</button>
                <div class="share-panel" id="share-panel">
                    <h3>친구에게 공유해 보세요!</h3>
                    <div class="share-grid">
                        <!-- X (Twitter) -->
                        <button class="share-btn x-twitter" onclick="shareX()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#000"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></span>
                            <span>X</span>
                        </button>
                        <!-- Facebook -->
                        <button class="share-btn facebook" onclick="shareFacebook()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></span>
                            <span>Facebook</span>
                        </button>
                        <!-- 카카오톡 -->
                        <button class="share-btn kakao" onclick="shareKakao()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#3C1E1E"><path d="M12 3c-5.523 0-10 3.582-10 8 0 2.838 1.876 5.327 4.717 6.734-.208.774-.755 2.807-.864 3.244-.136.547.2.54.42.394.172-.114 2.741-1.862 3.858-2.618A11.57 11.57 0 0012 19c5.523 0 10-3.582 10-8s-4.477-8-10-8z"/></svg></span>
                            <span>카카오톡</span>
                        </button>
                        <!-- Instagram -->
                        <button class="share-btn instagram" onclick="shareInstagram()">

                            <span>Instagram</span>
                        </button>
                        <!-- 텍스트 복사 -->
                        <button class="share-btn copy" onclick="copyResult()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#636e72"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></span>
                            <span>텍스트 복사</span>
                        </button>
                        <!-- 링크 복사 -->
                        <button class="share-btn copy" onclick="copyLink()">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#636e72"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></span>
                            <span>링크 복사</span>
                        </button>
                        <!-- 더보기 (모바일 Web Share API) -->
                        <button class="share-btn native" id="btn-native-share" onclick="nativeShare()" style="display:none;">
                            <span class="share-icon"><svg viewBox="0 0 24 24" fill="#6c5ce7"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></span>
                            <span>더보기</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   QUESTIONS
   ================================================================ */
const QUESTIONS = [
  {
    id: 'meal', emoji: '🕐',
    text: '지금 어떤 식사를 하려고 하나요?',
    options: [
      { value: 'breakfast', emoji: '🌅', label: '아침 식사' },
      { value: 'lunch',     emoji: '☀️', label: '점심 식사' },
      { value: 'dinner',    emoji: '🌙', label: '저녁 식사' },
      { value: 'snack',     emoji: '🌃', label: '야식 / 간식' }
    ]
  },
  {
    id: 'weather', emoji: '🌤️',
    text: '지금 밖의 날씨는 어떤가요?',
    options: [
      { value: 'hot',   emoji: '🔥', label: '덥고 습해요 (한여름)' },
      { value: 'cool',  emoji: '🍃', label: '선선하고 쾌적해요' },
      { value: 'cold',  emoji: '❄️', label: '쌀쌀하거나 추워요' },
      { value: 'rainy', emoji: '🌧️', label: '비가 오거나 흐려요' }
    ]
  },
  {
    id: 'mood', emoji: '😊',
    text: '지금 기분이 어떠세요?',

/* ================================================================
   STATE
   ================================================================ */
let currentQ = 0;
const answers = {};

/* ================================================================
   HELPERS – SCREEN SWITCHING
   ================================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

/* ================================================================
   QUIZ FLOW
   ================================================================ */
function startQuiz() {
  currentQ = 0;
  Object.keys(answers).forEach(k => delete answers[k]);
  showScreen('question');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const total = QUESTIONS.length;

  // progress
  const pct = Math.round(((currentQ + 1) / total) * 100);
  document.getElementById('prog-text').textContent = `${currentQ + 1} / ${total}`;
  document.getElementById('prog-pct').textContent  = pct + '%';
  document.getElementById('prog-fill').style.width  = pct + '%';

  // question
  document.getElementById('q-emoji').textContent = q.emoji;
  document.getElementById('q-text').textContent  = q.text;

  // options
  const wrap = document.getElementById('opts');
  wrap.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[q.id] === opt.value ? ' selected' : '');
    btn.innerHTML = `<span class="oe">${opt.emoji}</span><span>${opt.label}</span>`;
    btn.onclick = () => selectOption(q.id, opt.value);
    wrap.appendChild(btn);
  });

  // prev button
  document.getElementById('btn-prev').classList.toggle('hidden', currentQ === 0);

  // re-trigger animation
  const card = document.querySelector('.question-card');
  card.style.animation = 'none';
  card.offsetHeight;              // reflow
  card.style.animation = 'slideIn .35s ease';
}

function selectOption(qId, value) {
  answers[qId] = value;

  // brief highlight
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');

  setTimeout(() => {
    if (currentQ < QUESTIONS.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showLoading();
    }
  }, 300);
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

/* ================================================================
   LOADING → RESULT
   ================================================================ */
function showLoading() {
  showScreen('loading');
  setTimeout(() => {
    const results = recommend();
    renderResult(results);
    showScreen('result');
  }, 1800);
}

/* ================================================================
   RECOMMENDATION ENGINE
   ================================================================ */
function recommend() {
  // weights per question category
  const WEIGHTS = {
    meal: 1, weather: 1, mood: 1, gender: 1,
    hunger: 1, taste: 2, type: 2, people: 1, budget: 1
  };

  const scored = MENUS.map(menu => {
    let score = 0;
    let maxScore = 0;
    for (const key of Object.keys(WEIGHTS)) {
      const w = WEIGHTS[key];
      maxScore += w;
      if (answers[key] && menu.tags[key] && menu.tags[key].includes(answers[key])) {
        score += w;
      }
    }
    return { menu, score, maxScore, pct: Math.round((score / maxScore) * 100) };
  });

  // sort desc, break ties randomly
  scored.sort((a, b) => b.score - a.score || Math.random() - 0.5);

  return scored.slice(0, 3);
}

/* ================================================================
   RENDER RESULT
   ================================================================ */
function renderResult(top3) {
  // menu cards
  const wrap = document.getElementById('menu-cards');
  wrap.innerHTML = '';
  top3.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.style.animationDelay = (i * 0.2) + 's';
    card.innerHTML = `
      <div class="mc-header">
        <span class="mc-rank">${i + 1}</span>
        <span class="mc-emoji">${item.menu.emoji}</span>
        <div class="mc-info">
          <span class="mc-name">${item.menu.name}</span>
          <span class="mc-cat">${item.menu.cat}</span>
        </div>
      </div>
      <p class="mc-desc">${item.menu.desc}</p>
      <p class="mc-match">매칭률 ${item.pct}%</p>`;
    wrap.appendChild(card);
  });

  // reason
  const reasonBox = document.getElementById('reason-box');
  reasonBox.innerHTML = `<h3>💡 이런 이유로 추천했어요</h3><p>${buildReason()}</p>`;

  // answer summary
  const sumBox = document.getElementById('summary-box');
  const tags = QUESTIONS.map(q => {
    const chosen = q.options.find(o => o.value === answers[q.id]);
    return chosen ? `<span class="stag">${chosen.emoji} ${chosen.label}</span>` : '';
  }).join('');
  sumBox.innerHTML = `<h3>📋 나의 답변 요약</h3><div class="summary-tags">${tags}</div>`;
}

/* ================================================================
   BUILD REASON TEXT
   ================================================================ */
function buildReason() {
  const parts = [];

  // weather
  const wMap = { hot:'더운 날씨에 어울리는', cool:'선선한 날에 잘 맞는', cold:'추운 날 몸을 녹여줄', rainy:'비 오는 날 생각나는' };
  if (answers.weather) parts.push(wMap[answers.weather]);

  // mood
  const mMap = { stressed:'스트레스 해소에 좋은', happy:'기분 좋은 날 더 즐거워지는', normal:'편안하게 즐길 수 있는', sad:'마음을 위로해줄' };
  if (answers.mood) parts.push(mMap[answers.mood]);

  // taste
  const tMap = { spicy:'매콤하고 자극적인', savory:'고소하고 담백한', sweet:'달콤하고 부드러운', sour:'새콤상큼한', salty:'짭짤하고 감칠맛 나는' };
  if (answers.taste) parts.push(tMap[answers.taste]);

  // type
  const tyMap = { soup:'국물 요리', rice:'밥 요리', noodle:'면 요리', meat:'고기 요리', light:'가벼운 음식' };
  if (answers.type) parts.push(tyMap[answers.type] + '를');

  // hunger
  const hMap = { very:'배고픈 당신에게 든든하게!', moderate:'적당히 배를 채울 수 있어요.', light:'가볍게 즐기기 딱 좋아요.', bored:'입이 심심할 때 제격이에요.' };

  let reason = parts.join(' ') + ' 추천합니다. ';
  if (answers.hunger) reason += hMap[answers.hunger];

  return reason;
}

let lastTop3 = [];   // store for sharing

// override renderResult to save top3
const _origRenderResult = renderResult;

  lastTop3 = top3;
  _origRenderResult(top3);

function getShareText() {

    return '🍽️ [오늘 뭐 먹지?] 나를 위한 맞춤 메뉴 추천 사이트!';

    `${i + 1}위: ${item.menu.emoji} ${item.menu.name} (${item.menu.cat}) - 매칭률 ${item.pct}%`

function copyResult() {
  const text = getShareText() + '\n' + getShareUrl();
  copyToClipboard(text, '📋 추천 결과가 클립보드에 복사되었어요!');
}

function copyLink() {
  copyToClipboard(getShareUrl(), '🔗 링크가 클립보드에 복사되었어요!');
}

function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(successMsg);
    }).catch(() => {
      fallbackCopy(text, successMsg);
    });
  } else {
    fallbackCopy(text, successMsg);
  }
}

function fallbackCopy(text, successMsg) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '0';
  ta.style.left = '0';
  ta.style.width = '2em';
  ta.style.height = '2em';
  ta.style.padding = '0';
  ta.style.border = 'none';
  ta.style.outline = 'none';
  ta.style.boxShadow = 'none';
  ta.style.background = 'transparent';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    const successful = document.execCommand('copy');
    if (successful) {
      showToast(successMsg);
    } else {
      showToast('❌ 복사에 실패했어요. 링크를 직접 복사해 주세요.');
    }
  } catch (err) {
    showToast('❌ 복사에 실패했어요.');
  }
  document.body.removeChild(ta);
}

  if (navigator.share) {
    navigator.share({
      title: '오늘 뭐 먹지? 🍽️ 메뉴 추천 결과',
      text: text,
      url: url
    }).catch(() => {});
  } else {
    copyToClipboard(text + '\n' + url, '📋 전체 내용과 링크가 복사되었어요!');
  }
}

/* ================================================================
   TOAST
   ================================================================ */
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
